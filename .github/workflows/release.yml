name: Release

# 依 Conventional Commits 自動發版，不需要手動 merge：
# feat → 次版號（1.0.0 → 1.1.0），fix → 修訂號（1.0.0 → 1.0.1），feat! 或 BREAKING CHANGE → 主版號。
# 1. release-please 開（或更新）發版 PR，更新 package.json、plugin.json 的版本與 CHANGELOG.md。
# 2. 在發版 PR 上跑 scripts/validate.sh，通過後回報 validate 狀態，再 squash merge。
# 3. 再跑一次 release-please 建立 tag 與 GitHub Release。
#    GITHUB_TOKEN 推上 main 的 commit 不會再觸發 workflow，所以要在同一個 job 內補跑。

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release_pr
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@v4
        if: steps.release_pr.outputs.prs_created == 'true'

      - uses: actions/setup-node@v4
        if: steps.release_pr.outputs.prs_created == 'true'
        with:
          node-version: 22

      - name: Validate and merge release PR
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release_pr.outputs.pr }}
        run: |
          git fetch origin "$(jq -r .headBranchName <<< "$PR_JSON")"
          git checkout --detach FETCH_HEAD
          bash scripts/validate.sh
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=success -f context=validate
          gh pr merge "$(jq -r .number <<< "$PR_JSON")" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Create tag and GitHub Release
        if: steps.release_pr.outputs.prs_created == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
